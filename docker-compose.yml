# 本文件用于本地开发和单机调试。生产部署请使用 docker-compose.prod.example.yml
#
services:
  # UniSearch 主应用（单容器：前端 + 后端 + Nginx）
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unisearch-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UNISEARCH_HTTP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_APP_USER:-unisearch_dev}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:?必须设置 MYSQL_APP_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-unisearch}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}
      REDIS_DB: 0
      REDIS_TTL: 3600
    volumes:
      - app-cache:/app/cache
    networks:
      - unisearch-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: unisearch-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-unisearch}
      MYSQL_USER: ${MYSQL_APP_USER:-unisearch_dev}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?必须设置 MYSQL_APP_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - unisearch-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

  # Redis 缓存服务（可选）
  redis:
    image: redis:7-alpine
    container_name: unisearch-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - unisearch-network
    command:
      - sh
      - -c
      - redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  mysql-data:
    name: unisearch-mysql-data
  redis-data:
    name: unisearch-redis-data
  app-cache:
    name: unisearch-app-cache

networks:
  unisearch-network:
    name: unisearch-network
    driver: bridge
