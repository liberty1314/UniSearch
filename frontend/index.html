<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="/Uni.png?v=20250908" />
        <link rel="apple-touch-icon" href="/Uni.png" />

        <!-- Viewport -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Primary SEO -->
        <title>UniSearch — 智能网盘资源搜索引擎</title>
        <meta
            name="description"
            content="UniSearch 聚合百度网盘、阿里云盘、夸克网盘、天翼云盘等主流网盘平台，一站式搜索海量优质资源，快速找到您需要的文件。"
        />
        <meta
            name="keywords"
            content="网盘搜索,资源搜索,百度网盘,阿里云盘,夸克网盘,天翼云盘,UniSearch,网盘资源"
        />
        <meta name="robots" content="index, follow" />
        <meta name="author" content="UniSearch" />

        <!-- Open Graph (社交分享预览) -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="UniSearch" />
        <meta property="og:title" content="UniSearch — 智能网盘资源搜索引擎" />
        <meta
            property="og:description"
            content="聚合多种主流网盘，快速找到您需要的文件。支持百度网盘、阿里云盘、夸克网盘等 11 种平台。"
        />
        <meta property="og:image" content="/Uni.png" />
        <meta property="og:locale" content="zh_CN" />

        <!-- iOS Safari -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="UniSearch" />

        <!-- Vite HMR error overlay (dev only, ignored in prod) -->
        <script type="module">
            if (import.meta.hot?.on) {
                import.meta.hot.on("vite:error", (error) => {
                    if (error.err) {
                        console.error(
                            [error.err.message, error.err.frame]
                                .filter(Boolean)
                                .join("\n"),
                        );
                    }
                });
            }
        </script>
    </head>
    <body class="bg-gray-50 dark:bg-slate-950">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
