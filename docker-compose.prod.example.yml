# 生产部署模板：所有秘密与实际来源必须通过环境变量显式提供。
# 应用 HTTP 端口只绑定宿主机 loopback；外部代理负责 443、证书、HSTS，
# 并固定传递 X-Forwarded-Proto=https。禁止将宿主机 8080开放到公网。

services:
  app:
    image: ${UNISEARCH_IMAGE:-unisearch:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unisearch-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UNISEARCH_HTTP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      APP_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?必须设置 ALLOWED_ORIGINS}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_APP_USER:-unisearch_app}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:?必须设置 MYSQL_APP_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-unisearch}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}
      REDIS_DB: 0
      REDIS_TTL: ${REDIS_TTL:-3600}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?必须设置 AUTH_JWT_SECRET}
      RESOURCE_PUBLIC_ID_SECRET: ${RESOURCE_PUBLIC_ID_SECRET:?必须设置 RESOURCE_PUBLIC_ID_SECRET}
      SECRET_MASTER_KEY: ${SECRET_MASTER_KEY:?必须设置 SECRET_MASTER_KEY}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:?必须设置 INITIAL_ADMIN_USERNAME}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?必须设置 INITIAL_ADMIN_PASSWORD}
    volumes:
      - app-cache:/app/cache
    networks:
      - unisearch-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mysql:
    image: mysql:8.0
    container_name: unisearch-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-unisearch}
      MYSQL_USER: ${MYSQL_APP_USER:-unisearch_app}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?必须设置 MYSQL_APP_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - unisearch-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: unisearch-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - unisearch-network
    command:
      - sh
      - -c
      - redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  mysql-data:
    name: unisearch-prod-mysql-data
  redis-data:
    name: unisearch-prod-redis-data
  app-cache:
    name: unisearch-prod-app-cache

networks:
  unisearch-network:
    name: unisearch-prod-network
    driver: bridge
