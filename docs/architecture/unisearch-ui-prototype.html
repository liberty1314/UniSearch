.rank-list{counter-reset:rank;display:grid;gap:8px}.rank-row{counter-increment:rank;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:15px 8px}.rank-row:before{content:counter(rank,decimal-leading-zero);font-family:"IBM Plex Mono",monospace;color:var(--faint);font-size:13px}.rank-row:nth-child(-n+3):before{color:var(--accent);font-weight:700}.rank-row h3{margin:0 0 5px;font-size:14px}.rank-row p{margin:0;font-size:12px;color:var(--muted)}

function authPage(){let login=authMode==='login';return `<div class="screen auth-screen ${login?'auth-login':'auth-register'}"><div class="auth-shell"><section class="auth-story">${brand()}<div class="auth-aperture" aria-hidden="true"><div class="auth-orbit"></div><div class="auth-lens"><span>${login?'寻':'启'}</span></div><span class="auth-trace t1"><i></i>${login?'输入线索':'建立身份'}</span><span class="auth-trace t2"><i></i>${login?'聚合来源':'设定偏好'}</span><span class="auth-trace t3"><i></i>${login?'抵达答案':'开启发现'}</span></div><div class="auth-story-copy"><span>${login?'RETURN TO SEARCH':'BEGIN YOUR SEARCH'}</span><h1>${login?'欢迎回来，继续<em>寻找</em>。':'从一个账户，开始<em>发现</em>。'}</h1><p>${login?'只管登录，不必先选择身份。账户权限会在进入后自然展开。':'创建属于你的检索入口，让来源偏好和浏览体验保持一致。'}</p></div><div class="auth-features">${login?'<span><i></i>一个入口</span><span><i></i>自动识别权限</span><span><i></i>延续搜索体验</span>':'<span><i></i>建立账户</span><span><i></i>保存偏好</span><span><i></i>开始探索</span>'}</div></section><section class="auth-pane"><form class="auth-form" id="authForm"><div class="auth-tabs" role="tablist"><button type="button" class="${login?'active':''}" data-auth-mode="login" role="tab" aria-selected="${login}">登录</button><button type="button" class="${login?'':'active'}" data-auth-mode="register" role="tab" aria-selected="${!login}">注册</button></div><h2>${login?'继续你的搜索':'创建搜索账户'}</h2><p>${login?'输入账户信息，回到上次离开的地方。':'填写基础信息，开启统一的检索体验。'}</p>${login?'':`<div class="auth-field"><label for="displayName"><span>显示名称</span><small>NAME · 01</small></label><input id="displayName" required placeholder="如何称呼你" autocomplete="name"></div>`}<div class="auth-field"><label for="authUser"><span>用户名</span><small>ACCOUNT · ${login?'01':'02'}</small></label><input id="authUser" aria-label="用户名" required placeholder="输入用户名" autocomplete="username"></div><div class="auth-field"><label for="authPassword"><span>密码</span><small>KEY · ${login?'02':'03'}</small></label><input id="authPassword" aria-label="密码" required type="password" placeholder="输入密码" autocomplete="${login?'current-password':'new-password'}"></div>${login?'':`<div class="auth-field"><label for="authConfirm"><span>确认密码</span><small>CHECK · 04</small></label><input id="authConfirm" required type="password" placeholder="再次输入密码" autocomplete="new-password"></div>`}<button class="btn btn-primary auth-submit" type="submit">${login?'进入 UniSearch':'创建账户'}</button><div class="auth-helper">${login?'登录后，系统会根据账户权限自动显示个人中心或管理后台入口。':'新注册账户默认进入个人中心；管理权限由系统策略分配。'}</div></form></section></div></div>`}
function designSystem(){return `<div class="screen ds"><header class="ds-head"><div><h1>统一组件样式</h1><p>前台与后台共享语义、状态和交互；密度按场景区分。</p></div><span class="tag brand">Design tokens · v1</span></header><div class="token-row">${[['主色','var(--brand)'],['强调','var(--accent)'],['成功','var(--success)'],['警告','var(--warn)'],['危险','var(--danger)'],['边界','var(--line)']].map(x=>`<div class="swatch"><i style="--swatch:${x[1]}"></i><span>${x[0]}</span></div>`).join('')}</div><div class="ds-grid"><section class="ds-block"><h2>按钮与操作层级</h2><div class="stack"><button class="btn btn-primary" data-toast="主操作已触发">主操作</button><button class="btn btn-secondary" data-toast="次操作已触发">次操作</button><button class="btn btn-ghost" data-toast="轻操作已触发">轻操作</button><button class="btn btn-danger" data-dialog="危险操作|这是高风险操作的统一确认样式。">危险操作</button></div></section><section class="ds-block"><h2>筛选、标签与状态</h2><div class="stack"><button class="chip active" data-chip>全部</button><button class="chip" data-chip>文档</button><span class="tag brand">夸克网盘</span><span class="status">运行正常</span><span class="status off">已停用</span></div></section><section class="ds-block"><h2>表单控件</h2><div class="stack"><input class="field" placeholder="输入关键词"><select class="select"><option>全部状态</option></select><button class="toggle on" aria-label="示例开关" aria-pressed="true"></button></div></section><section class="ds-block"><h2>反馈与加载</h2><div class="stack" style="display:grid"><div class="note">信息提示使用语义色，不依赖图标区分。</div><div class="skeleton" style="width:84%"></div><div class="skeleton" style="width:62%"></div></div></section><section class="ds-block"><h2>空状态</h2><div class="empty">${icon('box')}<h3>暂无搜索记录</h3><p>尝试调整筛选条件，或开始一次新搜索。</p></div></section><section class="ds-block"><h2>分页器</h2>${pager()}</section></div></div>`}
function render(){let html={home:home(),search:search(),ranking:ranking(),account:profile('account'),preferences:profile('preferences'),disclaimer:disclaimer(),notfound:notfound(),auth:authPage(),dashboard:dashboard(),users:users(),plugins:plugins(),channels:channels(),performance:performance(),'search-audit':audit('search-audit'),'operation-audit':audit('operation-audit'),announcements:announcements(),'ip-ban':ipban(),settings:settings(),'design-system':designSystem()}[current];$('#stage').innerHTML=html;let p=pages.find(x=>x.id===current);$('#currentName').textContent=p.name;$('#currentPath').textContent=p.g+' · '+p.path;$('#pagePicker').value=current;$$('.page-link').forEach(x=>x.classList.toggle('active',x.dataset.go===current));bindStage();enhanceMotion();}
function bindStage(){
  $$('[data-go], [data-admin]',$('#stage')).forEach(b=>b.addEventListener('click',e=>{e.preventDefault();accountMenuOpen=false;go(b.dataset.go||b.dataset.admin)}));
  $$('[data-account-trigger]',$('#stage')).forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();accountMenuOpen=!accountMenuOpen;b.setAttribute('aria-expanded',accountMenuOpen);let menu=b.nextElementSibling;if(menu)menu.classList.toggle('open',accountMenuOpen)}));
  $$('[data-app-theme]',$('#stage')).forEach(b=>b.addEventListener('click',toggleTheme));
  $$('[data-logout]',$('#stage')).forEach(b=>b.addEventListener('click',()=>{sessionRole=null;accountMenuOpen=false;go('home');showToast('已退出登录')}));
  $$('[data-auth-mode]',$('#stage')).forEach(b=>b.addEventListener('click',()=>{authMode=b.dataset.authMode;render()}));
  $$('[data-toast]',$('#stage')).forEach(b=>b.addEventListener('click',()=>showToast(b.dataset.toast)));
  $$('[data-dialog]',$('#stage')).forEach(b=>b.addEventListener('click',()=>{let [t,x]=b.dataset.dialog.split('|');openDialog(t,x)}));
  $$('[data-chip]',$('#stage')).forEach(b=>b.addEventListener('click',()=>{let wrap=b.parentElement;$$('[data-chip]',wrap).forEach(x=>x.classList.remove('active'));b.classList.add('active');showToast('筛选条件已更新')}));
  $$('[data-rank-mode]',$('#stage')).forEach(b=>b.addEventListener('click',()=>{rankMode=b.dataset.rankMode;render();showToast(`已切换为${rankMode}`)}));
  $$('[data-rank-period]',$('#stage')).forEach(b=>b.addEventListener('click',()=>{rankPeriod=b.dataset.rankPeriod;render();showToast(`已切换到${rankPeriod}榜单`)}));
  $$('[data-rank-category]',$('#stage')).forEach(b=>b.addEventListener('click',()=>{rankCategory=b.dataset.rankCategory;render();showToast(`已筛选${rankCategory}内容`)}));
  let rankRefresh=$('#rankRefresh');if(rankRefresh)rankRefresh.addEventListener('click',()=>showToast(`${rankPeriodLabel()}已刷新`));
  $$('.toggle',$('#stage')).forEach(b=>b.addEventListener('click',()=>{b.classList.toggle('on');b.setAttribute('aria-pressed',b.classList.contains('on'))}));
  $$('[data-filter]',$('#stage')).forEach(b=>b.addEventListener('click',()=>showToast('筛选结果已更新')));
  $$('[data-drive]',$('#stage')).forEach(b=>b.addEventListener('click',()=>{let key=b.dataset.drive;selectedDrives.has(key)?selectedDrives.delete(key):selectedDrives.add(key);loadedCount=48;render();showToast(`已更新${b.querySelector('span').textContent}筛选`)}));
  let toggleAll=$('#toggleAllDrives');if(toggleAll)toggleAll.addEventListener('click',()=>{selectedDrives=selectedDrives.size===driveTypes.length?new Set():new Set(driveTypes.map(d=>d.key));loadedCount=48;render();showToast(selectedDrives.size?'已全选网盘类型':'已取消全部网盘类型')});
  let clearDrives=$('#clearDriveFilters');if(clearDrives)clearDrives.addEventListener('click',()=>{selectedDrives=new Set();loadedCount=48;render();showToast('已清空全部网盘筛选')});
  $$('[data-result-view]',$('#stage')).forEach(b=>b.addEventListener('click',()=>{searchView=b.dataset.resultView;let shell=$('#searchResults');$$('[data-result-view]',$('#stage')).forEach(x=>{let active=x===b;x.classList.toggle('active',active);x.setAttribute('aria-pressed',active)});if(shell)shell.dataset.view=searchView;showToast(`已切换为${searchView==='grid'?'卡片':'列表'}视图`)}));
  let advanced=$('#advancedTrigger'),panel=$('#advancedPanel');if(advanced&&panel)advanced.addEventListener('click',()=>{let open=panel.classList.toggle('open');advanced.classList.toggle('open',open);advanced.setAttribute('aria-expanded',open);advanced.firstChild.textContent=open?'收起高级条件':'展开高级条件'});
  $$('[data-add-keyword]',$('#stage')).forEach(b=>b.addEventListener('click',()=>{let include=b.dataset.addKeyword==='include',input=$(include?'#includeKeyword':'#excludeKeyword'),list=include?pendingInclude:pendingExclude,value=input.value.trim();if(value&&!list.includes(value))list.push(value);input.value='';let target=$(include?'#includeTags':'#excludeTags');target.innerHTML=list.map(k=>`<span class="pending-tag">${k}</span>`).join('');showToast(value?'关键词已暂存，应用后生效':'请输入关键词')}));
  let apply=$('#applyAdvanced');if(apply)apply.addEventListener('click',()=>{appliedInclude=[...pendingInclude];appliedExclude=[...pendingExclude];loadedCount=48;render();showToast('高级筛选已应用')});
  let reset=$('#resetAdvanced');if(reset)reset.addEventListener('click',()=>{pendingInclude=[];pendingExclude=[];appliedInclude=[];appliedExclude=[];loadedCount=48;render();showToast('高级条件已重置')});
  let sortToggle=$('#sortToggle'),sortMenu=$('#sortMenu');if(sortToggle&&sortMenu)sortToggle.addEventListener('click',()=>{let open=sortMenu.classList.toggle('open');sortToggle.setAttribute('aria-expanded',open)});
  $$('[data-sort]',$('#stage')).forEach(b=>b.addEventListener('click',()=>{sortMode=b.dataset.sort;loadedCount=48;render();showToast(`已切换为${sortMode}`)}));
  let loadMore=$('#loadMore');if(loadMore)loadMore.addEventListener('click',()=>{loadedCount+=48;render();showToast('已追加更多搜索结果')});
  $$('[data-open-result]',$('#stage')).forEach(card=>{let open=()=>showToast('已打开资源详情预览');card.addEventListener('click',open);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});
  let backTop=$('#backTop');if(backTop){backTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));backTop.classList.toggle('show',window.scrollY>320)}
  $$('.pager button',$('#stage')).forEach(b=>b.addEventListener('click',()=>{if(/^\d+$/.test(b.textContent)){$$('.pager button',$('#stage')).forEach(x=>x.classList.remove('active'));b.classList.add('active')}showToast('已切换页面')}));
  let sf=$('[data-search]',$('#stage'));if(sf)sf.addEventListener('submit',e=>{e.preventDefault();go('search')});
  let af=$('#authForm');if(af)af.addEventListener('submit',e=>{e.preventDefault();if(authMode==='login'){let username=$('#authUser').value.trim().toLowerCase();sessionRole=(username==='admin'||username==='lihua')?'admin':'user';showToast('登录成功');go('account')}else{sessionRole='user';showToast('注册成功，已进入个人中心');go('account')}});
  $$('[data-setting-tab]',$('#stage')).forEach(b=>b.addEventListener('click',()=>{$$('[data-setting-tab]',$('#stage')).forEach(x=>x.classList.remove('active'));b.classList.add('active');let text=b.dataset.settingTab==='search'?['默认结果页大小','请求超时','结果缓存时间']:b.dataset.settingTab==='security'?['会话有效期','登录失败锁定','IP 风险阈值']:['告警渠道','通知频率','接收人范围'];$('#settingsForm').innerHTML=`<div class="mono" style="color:var(--accent);margin-bottom:12px">${b.dataset.settingTab.toUpperCase()} PARAMETERS</div>${text.map((x,i)=>`<div class="dial-row"><div><b>${x}</b><small style="display:block;color:var(--muted)">当前使用标准策略</small></div>${i===0?'<div class="dial"></div>':i===1?'<input class="field" value="标准策略" style="width:110px;min-width:0">':'<button class="toggle on" aria-label="'+x+'" aria-pressed="true"></button>'}</div>`).join('')}<button class="btn btn-primary" style="margin-top:18px" data-toast="设置已在当前原型会话中应用">应用设置</button>`;bindStage()}));
}
function enhanceMotion(){let stage=$('#stage'),screen=$('.screen',stage);if(!screen)return;let aura=document.createElement('i');aura.className='pointer-aura';aura.setAttribute('aria-hidden','true');screen.prepend(aura);if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;screen.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;let r=screen.getBoundingClientRect();screen.style.setProperty('--pointer-x',`${e.clientX-r.left}px`);screen.style.setProperty('--pointer-y',`${e.clientY-r.top}px`)});screen.addEventListener('pointerleave',()=>{screen.style.setProperty('--pointer-x','50%');screen.style.setProperty('--pointer-y','35%')});$$('.glass-feature,.podium-card,.command-hero,.plug-card,.news-lead,.login-form',screen).forEach(card=>{card.classList.add('tilt');card.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;let r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.setProperty('--ry',`${x*5}deg`);card.style.setProperty('--rx',`${y*-5}deg`)});card.addEventListener('pointerleave',()=>{card.style.setProperty('--rx','0deg');card.style.setProperty('--ry','0deg')})})}
function go(id){if(!pages.some(p=>p.id===id))return;current=id;render();window.scrollTo({top:0,behavior:'smooth'})}
function toggleTheme(){let d=document.documentElement,now=d.dataset.theme;if(!now)now=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';d.dataset.theme=now==='dark'?'light':'dark';showToast(`已切换为${d.dataset.theme==='dark'?'深色':'浅色'}模式`)}
function showToast(text){let t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800)}
function openDialog(t,x){$('#dialogTitle').textContent=t;$('#dialogText').textContent=x;$('#dialog').classList.add('open');$('#dialogConfirm').focus()}
function closeDialog(){$('#dialog').classList.remove('open')}
function init(){let groups=[...new Set(pages.map(p=>p.g))];$('#catalogNav').innerHTML=groups.map(g=>`<div class="group-label">${g}</div><div class="page-list">${pages.filter(p=>p.g===g).map((p,i)=>`<button class="page-link ${p.id===current?'active':''}" data-go="${p.id}"><span>${p.name}</span><small>${String(i+1).padStart(2,'0')}</small></button>`).join('')}</div>`).join('');$('#pagePicker').innerHTML=pages.map(p=>`<option value="${p.id}">${p.g} · ${p.name}</option>`);$$('.page-link').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));$('#pagePicker').addEventListener('change',e=>go(e.target.value));$('#themeBtn').addEventListener('click',toggleTheme);$('#fitBtn').addEventListener('click',()=>{compact=!compact;$('#stage').style.maxWidth=compact?'960px':'';$('#stage').style.margin=compact?'0 auto':'';showToast(compact?'已切换为紧凑桌面画布':'已恢复宽屏画布')});$('[data-close]').addEventListener('click',closeDialog);$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))closeDialog()});$('#dialogConfirm').addEventListener('click',()=>{closeDialog();showToast('操作已确认（原型）')});document.addEventListener('click',e=>{if(accountMenuOpen&&!e.target.closest('.account-wrap')){accountMenuOpen=false;$$('.account-menu').forEach(x=>x.classList.remove('open'));$$('[data-account-trigger]').forEach(x=>x.setAttribute('aria-expanded','false'))}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();accountMenuOpen=false;$$('.account-menu').forEach(x=>x.classList.remove('open'));let menu=$('#sortMenu');if(menu)menu.classList.remove('open')}});window.addEventListener('scroll',()=>{let b=$('#backTop');if(b)b.classList.toggle('show',window.scrollY>320)},{passive:true});render()}
init();
</script>
